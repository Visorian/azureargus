name: Validate Event Hub deployment template

on:
  pull_request:
    paths:
      - "infrastructure/event-hub/*.bicep"
      - "infrastructure/event-hub/azuredeploy*.json"
      - ".github/workflows/event-hub-template.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/event-hub/*.bicep"
      - "infrastructure/event-hub/azuredeploy*.json"
      - ".github/workflows/event-hub-template.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rebuild and compare deployment template
        shell: bash
        env:
          BICEP_VERSION: v0.46.1
          BICEP_SHA256: 3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9
        run: |
          set -euo pipefail

          bicep="$RUNNER_TEMP/bicep"
          generated="$RUNNER_TEMP/azuredeploy.json"
          generated_event_hub_only="$RUNNER_TEMP/azuredeploy-event-hub-only.json"

          curl --fail --location --silent --show-error \
            "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64" \
            --output "$bicep"
          echo "$BICEP_SHA256  $bicep" | sha256sum --check -
          chmod +x "$bicep"

          "$bicep" lint infrastructure/event-hub/main.bicep
          "$bicep" build infrastructure/event-hub/main.bicep --outfile "$generated"
          "$bicep" lint infrastructure/event-hub/event-hub-only.bicep
          "$bicep" build infrastructure/event-hub/event-hub-only.bicep --outfile "$generated_event_hub_only"

          if ! cmp --silent infrastructure/event-hub/azuredeploy.json "$generated"; then
            diff -u infrastructure/event-hub/azuredeploy.json "$generated" || true
            exit 1
          fi

          if ! cmp --silent infrastructure/event-hub/azuredeploy-event-hub-only.json "$generated_event_hub_only"; then
            diff -u infrastructure/event-hub/azuredeploy-event-hub-only.json "$generated_event_hub_only" || true
            exit 1
          fi

          jq --exit-status '
            (.parameters | keys | sort) == [
              "eventHubName",
              "eventHubRetentionHours",
              "firewallName",
              "firewallResourceGroupName"
            ]
            and .parameters.firewallName.minLength == 1
            and .parameters.firewallResourceGroupName.minLength == 1
            and (.parameters.firewallName | has("defaultValue") | not)
            and (.parameters.firewallResourceGroupName | has("defaultValue") | not)
            and all(.resources[]; has("condition") | not)
            and ([
              .resources[]
              | select(any(
                  .properties.template.resources[]?;
                  .type == "Microsoft.EventHub/namespaces"
                ))
              | .properties.parameters.location.value
            ] | length == 1 and (.[0] | contains("outputs.location.value")))
            and ([
              .resources[]
              | .properties.template.resources[]
              | select(.type == "Microsoft.Insights/diagnosticSettings")
              | .properties.logs[].category
            ] == [
              "AZFWNetworkRule",
              "AZFWApplicationRule",
              "AZFWNatRule",
              "AZFWThreatIntel",
              "AZFWFqdnResolveFailure",
              "AZFWDnsQuery",
              "AZFWIdpsSignature"
            ])
          ' infrastructure/event-hub/azuredeploy.json

          jq --exit-status '
            (.parameters | keys | sort) == [
              "eventHubName",
              "eventHubRetentionHours"
            ]
            and all(.resources[]; has("condition") | not)
            and ([
              .resources[]
              | select(any(
                  .properties.template.resources[]?;
                  .type == "Microsoft.EventHub/namespaces"
                ))
              | .properties.parameters.location.value
            ] == ["[resourceGroup().location]"])
          ' infrastructure/event-hub/azuredeploy-event-hub-only.json
