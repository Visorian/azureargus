name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pending: ${{ steps.resolve.outputs.pending }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve merged release candidate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          emit_candidate() {
            {
              echo 'pending=true'
              printf 'sha=%s\n' "$sha"
              printf 'tag=%s\n' "$tag"
              printf 'version=%s\n' "$version"
            } >>"$GITHUB_OUTPUT"
          }

          candidates="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" |
              jq -c --arg repo "$GITHUB_REPOSITORY" '[.[][] |
                select(.merged_at != null) |
                select(.user.login == "azureargus-release[bot]") |
                select(.head.repo.full_name == $repo) |
                select(.head.ref == "release-please--branches--main--components--azure-argus") |
                select(any(.labels[]?; .name == "autorelease: pending"))
              ]'
          )"
          count="$(jq 'length' <<<"$candidates")"
          if [ "$count" -eq 0 ]; then
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)"
            if [ -z "$latest" ]; then
              echo 'pending=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            tag="$(jq -r '.tag_name' <<<"$latest")"
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              printf 'latest release tag is not stable: %s\n' "$tag" >&2
              exit 1
            }
            version="${tag#v}"
            sha="$(jq -r '.target_commitish' <<<"$latest")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              printf 'latest release target is not exact lowercase hex: %s\n' "$sha" >&2
              exit 1
            }
            bicep="$(
              gh api "repos/${GITHUB_REPOSITORY}/contents/infrastructure/application/main.bicep?ref=main" \
                --jq .content | base64 --decode
            )"
            arm="$(
              gh api "repos/${GITHUB_REPOSITORY}/contents/infrastructure/application/azuredeploy.json?ref=main" \
                --jq .content | base64 --decode
            )"
            readme="$(
              gh api "repos/${GITHUB_REPOSITORY}/contents/README.md?ref=main" \
                --jq .content | base64 --decode
            )"
            bicep_version="$(sed -n "s/^param targetVersion string = '\([^']*\)'$/\1/p" <<<"$bicep")"
            arm_version="$(jq -r '.parameters.targetVersion.defaultValue' <<<"$arm")"
            mapfile -t readme_images < <(
              grep -Eo 'ghcr.io/visorian/azureargus:[0-9]+\.[0-9]+\.[0-9]+' <<<"$readme" || true
            )
            if [ "$bicep_version" = "$version" ] && [ "$arm_version" = "$version" ] &&
              [ "${#readme_images[@]}" -eq 1 ] &&
              [ "${readme_images[0]}" = "ghcr.io/visorian/azureargus:${version}" ]; then
              echo 'pending=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            emit_candidate
            exit 0
          fi
          [ "$count" -eq 1 ] || {
            printf 'expected at most one merged pending release candidate, found %s\n' "$count" >&2
            exit 1
          }

          candidate="$(jq -c '.[0]' <<<"$candidates")"
          sha="$(jq -r '.merge_commit_sha' <<<"$candidate")"
          title="$(jq -r '.title' <<<"$candidate")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'release candidate SHA is not exact lowercase hex: %s\n' "$sha" >&2
            exit 1
          }
          manifest="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${sha}" \
              --jq .content | base64 --decode
          )"
          version="$(jq -er '.["."] | select(type == "string")' <<<"$manifest")"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            printf 'release version is not stable X.Y.Z: %s\n' "$version" >&2
            exit 1
          }
          [ "$title" = "chore(main): release ${version}" ] || {
            printf 'release pull request title %s does not identify %s\n' "$title" "$version" >&2
            exit 1
          }
          tag="v${version}"
          emit_candidate

  prepare:
    needs: candidate
    if: needs.candidate.outputs.pending != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AZURE_ARGUS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AZURE_ARGUS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Prepare release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  publish:
    needs: candidate
    if: needs.candidate.outputs.pending == 'true'
    permissions:
      checks: read
      contents: read
      packages: write
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/publish-release.yml
    with:
      sha: ${{ needs.candidate.outputs.sha }}
      tag: ${{ needs.candidate.outputs.tag }}
      version: ${{ needs.candidate.outputs.version }}
    secrets:
      AZURE_ARGUS_RELEASE_APP_PRIVATE_KEY: ${{ secrets.AZURE_ARGUS_RELEASE_APP_PRIVATE_KEY }}
